# SGLang serving Qwen3-8B on one NVIDIA H200 GPU through KServe (participant baseline).
# Generated by `cd workshop && uv run python -m workshop_utils.generate`; edit workshop/workshop_utils/ instead.
#
# The participant's service on the shared workshop cluster: name qwen3, no namespace
# (kubectl uses the one in your kubeconfig), the H200 pool, no Gateway route (reach it
# with kubectl port-forward). Run these from the workshop/ folder:
#
# Apply:     kubectl apply -f manifests/sglang-qwen3-nvidia.yaml
# Watch:     kubectl get llminferenceservice qwen3 -w
# Logs:      kubectl logs deploy/qwen3-kserve -c main -f
# Chat:      kubectl port-forward svc/qwen3-kserve-workload-svc 8001:8000
# Remove:    kubectl delete -f manifests/sglang-qwen3-nvidia.yaml
#
# To change a setting, a plain re-apply never completes (one GPU per participant): stop,
# wait until the pod is gone, apply, then start again:
#   kubectl annotate llminferenceservice qwen3 serving.kserve.io/stop=true --overwrite
#   kubectl apply -f manifests/sglang-qwen3-nvidia.yaml
#   kubectl annotate llminferenceservice qwen3 serving.kserve.io/stop-
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: qwen3
  labels:
    workshop/vendor: nvidia
    workshop/tp: '1'
spec:
  model:
    uri: hf://Qwen/Qwen3-8B
    name: qwen3
  replicas: 1
  template:
    containers:
    - name: main
      image: lmsysorg/sglang:v0.5.22-runtime
      command:
      - python3
      - -m
      - sglang.launch_server
      args:
      - --model-path
      - /mnt/models
      - --served-model-name
      - qwen3
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --tp-size
      - '1'
      - --enable-metrics
      - --reasoning-parser
      - qwen3
      env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: hf-secret
            key: HF_TOKEN
            optional: true
      - name: HF_HUB_OFFLINE
        value: '1'
      ports:
      - name: http
        containerPort: 8000
        protocol: TCP
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        readOnlyRootFilesystem: false
      resources:
        limits:
          nvidia.com/gpu: '1'
          cpu: '8'
          memory: 64Gi
        requests:
          nvidia.com/gpu: '1'
          cpu: '8'
          memory: 64Gi
      startupProbe:
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 180
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 10
        timeoutSeconds: 8
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 5
    volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
    nodeSelector:
      crusoe.ai/accelerator: nvidia-h200-141gb-sxm-ib
