[project]
name = "sglang-kubernetes-workshop"
version = "0.1.0"
description = "Workshop: deploy SGLang on Kubernetes with KServe, benchmark it under realistic load, and tune KV cache precision and scheduling."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Crusoe AI", email = "devcommunity@crusoe.ai" },
]
dependencies = [
    "openai>=1.50",
    "requests>=2.32",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "jupyterlab>=4.3",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "nbformat>=5.10",
]

[tool.uv]
# A workshop, not a library: uv builds the environment but installs nothing
# from this directory itself. The notebooks import `workshop_utils` from the
# workshop/ folder (each notebook adds it to sys.path).
package = false

[tool.ruff]
line-length = 110
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["workshop_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["workshop"]
