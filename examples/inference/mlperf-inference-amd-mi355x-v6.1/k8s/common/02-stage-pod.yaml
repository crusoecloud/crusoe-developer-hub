# A tiny helper pod that mounts the shared PVC so you can copy files onto it with `kubectl cp`
# (patches, warmup overlays, etc.) before launching a run. The head/worker pods apply patches
# from /shared/patches[-ds]/ at start, so those files must already be on the PVC.
#
#   kubectl apply -f k8s/common/02-stage-pod.yaml
#   kubectl -n mlperf exec stage -- mkdir -p /shared/patches /shared/patches-ds
#   kubectl -n mlperf cp k8s/gpt-oss/patches/harden-registration.py      mlperf/stage:/shared/patches/harden-registration.py
#   ... (repeat for each patch/overlay) ...
#   kubectl -n mlperf delete pod stage    # when done
apiVersion: v1
kind: Pod
metadata:
  name: stage
  namespace: mlperf
spec:
  restartPolicy: Never
  containers:
    - name: stage
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 36000"]
      volumeMounts:
        - { name: shared, mountPath: /shared }
  volumes:
    - name: shared
      persistentVolumeClaim: { claimName: mlperf-shared }
