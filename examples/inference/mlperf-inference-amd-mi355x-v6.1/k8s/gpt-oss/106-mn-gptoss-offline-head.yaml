# Multi-node ZMQ distributed SUT (AMD multi-node technique) - gpt-oss-120b v6.1 OFFLINE HEAD.
# TEMPLATE: rendered by launch-mn-offline.sh (fills ${RUN} ${HEAD_NODE} ${HEAD_IP}
# ${DEVICE_COUNT} ${TARGET_QPS} ${OUT}). Do not apply directly.
#
# Offline differs from the Server head (100-mn-gptoss-head.yaml):
#   - local worker + workers run distributed_sync_offline.py (scenario=offline, SYNC engine),
#     NOT distributed_async_server.py (which asserts scenario==server).
#   - head SUT is DistributedOfflineSUT: it splits samples into perf-weighted ranges, sends
#     each worker its range in bulk, and collects bulk results - so there is NO per-query
#     head funnel (that is what capped the Server scenario at ~4203 samples/s at 512 GPUs).
#   - no target latency limit; Offline reports raw throughput → the true linear-scaling number.
#   - model laid out as a real dir (top-level file symlinks + fp4_quantized subdir), matching
#     the single-node Offline run (99-v61-gptoss-offline.yaml) that hit 115,197 tok/s.
#   - harness_config.target_qps here sizes samples_per_query (offline_expected_qps); the
#     MN user.conf (user_mi355x_mn.conf) sets Offline.min_duration=600000 (10-min window),
#     and LoadGen replays the 6396-sample pool to fill it.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${RUN}-head
  namespace: mlperf
  labels: { app: mlperf-mn-gptoss-offline, role: head, benchmark: gpt-oss-120b, run: ${RUN} }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  template:
    metadata: { labels: { app: mlperf-mn-gptoss-offline, role: head, benchmark: gpt-oss-120b, run: ${RUN} } }
    spec:
      restartPolicy: Never
      hostNetwork: true
      hostIPC: true
      imagePullSecrets: [{ name: regcred }]
      nodeName: ${HEAD_NODE}
      containers:
        - name: head
          image: <your-registry>/<your-project>/gptoss_vllm_v0.22.0
          securityContext: { privileged: true }
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -x
              # 512-way fan-in opens ~2 sockets/worker on the head; the default 1024-fd soft
              # limit caps registration. Raise it (hard limit is 524288).
              ulimit -Sn 524288 2>/dev/null || ulimit -Sn 262144 2>/dev/null || ulimit -Sn 65536 || true
              echo "fd limit now: $(ulimit -Sn)"
              HEAD_IP=${HEAD_IP}
              OUT=${OUT}
              M=/shared/models/gpt-oss-120b-b5c939d       # native mxfp4 (correct v6.1 model)
              DS=/shared/datasets/gpt-oss-120b/raw/gpt-oss-dataset
              mkdir -p /data "$OUT/head"
              # clear stale results so a monitor can't read an old summary
              rm -f "$OUT/head"/mlperf_log_*.txt "$OUT/head"/mlperf_log_*.json "$OUT/head-sut.log" "$OUT"/worker-*.log 2>/dev/null || true
              # offline model layout: real dir with files at top + fp4_quantized subdir
              rm -rf /model/gpt-oss-120b; mkdir -p /model/gpt-oss-120b
              for f in "$M"/*; do ln -sf "$f" /model/gpt-oss-120b/; done
              ln -sfn "$M" /model/gpt-oss-120b/fp4_quantized
              ln -sfn "$DS" /data/gptoss-dataset
              rm -rf /root/.cache && ln -sfn /shared/v61-cache/gptoss-mxfp4 /root/.cache 2>/dev/null || true
              # harden the offline head's ZMQ registration for large fleets (dedup/timeout +
              # ROUTER_HANDOVER/backlog + skip-stray-REGISTER). See k8s/patches/.
              if [ -f /shared/patches/harden-offline-sut.py ]; then python3 /shared/patches/harden-offline-sut.py; else echo "WARN: offline head patch not staged on PVC"; fi
              cd /lab-mlperf-inference/code
              # (1) local worker for this node's 8 GPUs - connects back to the head (self).
              #     DEDICATED_HEAD=1 (__LOCAL_WORKER__=0): skip it - this node is a pure SUT and
              #     all ${DEVICE_COUNT} GPUs come from remote worker nodes (mirrors k8s-ds pattern).
              if [ "__LOCAL_WORKER__" = "1" ]; then
                python3 harness_llm/backends/vllm/zmq/distributed_sync_offline.py \
                  --config-path gpt-oss-120b/ --config-name offline_mi355x \
                  node_id=$(hostname) headnode_address=${HEAD_IP}:12345 \
                  > "$OUT/worker-head.log" 2>&1 &
                sleep 5
              else
                echo "DEDICATED head: no co-located worker (all ${DEVICE_COUNT} GPUs are remote workers)"
              fi
              # (2) SUT client - binds :12345 (dispatch) / :12346 (results), waits for
              #     ${DEVICE_COUNT} GPUs of workers, then runs LoadGen Offline.
              bash run_harness.sh --config-path gpt-oss-120b/ --config-name offline_mi355x --backend zmq \
                test_mode=performance port=12345 harness_config.device_count=${DEVICE_COUNT} \
                harness_config.target_qps=${TARGET_QPS} \
                harness_config.user_conf_path=/lab-mlperf-inference/code/gpt-oss-120b/user_mi355x_mn.conf \
                harness_config.dataset_path=/data/gptoss-dataset/perf/perf_eval_ref.parquet \
                harness_config.output_log_dir="$OUT/head" 2>&1 | tee "$OUT/head-sut.log" | tail -40
              echo "===== ${RUN} OFFLINE RESULT (device_count=${DEVICE_COUNT}, expected_qps=${TARGET_QPS}) ====="
              grep -iE 'Result is|Tokens per second|Samples per second|Completed tokens' "$OUT/head/mlperf_log_summary.txt" 2>/dev/null
          resources: { requests: { amd.com/gpu: 8, cpu: "180", memory: 1800Gi }, limits: { amd.com/gpu: 8 } }
          volumeMounts: [{ name: shared, mountPath: /shared }, { name: dshm, mountPath: /dev/shm }]
      volumes:
        - { name: shared, persistentVolumeClaim: { claimName: mlperf-shared } }
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 512Gi } }
