# Multi-node ZMQ distributed SUT - gpt-oss-120b v6.1 OFFLINE WORKERS (all of them, one Job).
# TEMPLATE: rendered by launch-mn-offline.sh (fills ${RUN} ${HEAD_IP} ${WORKERS} ${OUT}).
#
# One Indexed Job with parallelism/completions = ${WORKERS} (= N-1); each pod claims a whole
# node's 8 GPUs, so Kubernetes auto-spreads one worker per free node. Each pod runs
# distributed_sync_offline.py, which spawns 8 GPU-server processes (one per local GPU),
# each a zmq.DEALER that CONNECTS to ${HEAD_IP} (:12346 to REGISTER [identity, perf],
# :12345 for the ack). Offline workers do NOT load the dataset - the head sends prompt
# token IDs to them in bulk - so only the model is symlinked here.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${RUN}-workers
  namespace: mlperf
  labels: { app: mlperf-mn-gptoss-offline, role: worker, benchmark: gpt-oss-120b, run: ${RUN} }
spec:
  completionMode: Indexed
  completions: ${WORKERS}
  parallelism: ${WORKERS}
  backoffLimit: ${WORKERS}
  activeDeadlineSeconds: 5400
  ttlSecondsAfterFinished: 7200
  template:
    metadata: { labels: { app: mlperf-mn-gptoss-offline, role: worker, benchmark: gpt-oss-120b, run: ${RUN} } }
    spec:
      restartPolicy: Never
      hostNetwork: true
      hostIPC: true
      imagePullSecrets: [{ name: regcred }]
      containers:
        - name: worker
          image: <your-registry>/<your-project>/gptoss_vllm_v0.22.0
          securityContext: { privileged: true }
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -x
              ulimit -Sn 524288 2>/dev/null || ulimit -Sn 262144 2>/dev/null || ulimit -Sn 65536 || true
              HEAD_IP=${HEAD_IP}
              OUT=${OUT}
              M=/shared/models/gpt-oss-120b-b5c939d
              mkdir -p /data "$OUT"
              # offline model layout: real dir with files at top + fp4_quantized subdir
              rm -rf /model/gpt-oss-120b; mkdir -p /model/gpt-oss-120b
              for f in "$M"/*; do ln -sf "$f" /model/gpt-oss-120b/; done
              ln -sfn "$M" /model/gpt-oss-120b/fp4_quantized
              ln -sfn /shared/v61-cache/gptoss-mxfp4 /root/.cache 2>/dev/null || true
              # large-fleet fix: re-send REGISTER until the head acks. See k8s/patches/.
              if [ -f /shared/patches/harden-worker-offline.py ]; then python3 /shared/patches/harden-worker-offline.py; else echo "WARN: offline worker patch not staged"; fi
              cd /lab-mlperf-inference/code
              # mild stagger by job index to spread model-load + warmup-JIT across the fleet
              sleep $(( ${JOB_COMPLETION_INDEX:-0} * 2 ))
              echo "OFFLINE WORKER $(hostname) [idx=${JOB_COMPLETION_INDEX:-?}] -> head ${HEAD_IP}:12345/12346"
              python3 harness_llm/backends/vllm/zmq/distributed_sync_offline.py \
                --config-path gpt-oss-120b/ --config-name offline_mi355x \
                node_id=$(hostname) headnode_address=${HEAD_IP}:12345 \
                2>&1 | tee "$OUT/worker-$(hostname).log" | tail -20
          resources: { requests: { amd.com/gpu: 8, cpu: "180", memory: 1800Gi }, limits: { amd.com/gpu: 8 } }
          volumeMounts: [{ name: shared, mountPath: /shared }, { name: dshm, mountPath: /dev/shm }]
      volumes:
        - { name: shared, persistentVolumeClaim: { claimName: mlperf-shared } }
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 512Gi } }
