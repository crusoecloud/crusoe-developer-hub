# DeepSeek-R1 v6.1 multi-node ZMQ - SERVER WORKERS with WARMUP (Indexed Job; template).
# Rendered by launch-mn-deepseek.sh (SCENARIO=server WARMUP=1). Each pod = one 8-GPU SGLang
# replica running distributed_async_server.py. Every worker applies the same warmup enablement
# as the head (patch constants.py + overlay server_mn_warmup.yaml) because the 10-prompt canned
# warmup runs on EACH worker (distributed_async_server.py run_warmup, gated on the constants entry)
# before it registers/accepts LoadGen traffic.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${RUN}-workers
  namespace: mlperf
  labels: { app: mlperf-ds-mn-server, role: worker, benchmark: deepseek-r1, run: ${RUN} }
spec:
  completionMode: Indexed
  completions: ${WORKERS}
  parallelism: ${WORKERS}
  backoffLimit: ${WORKERS}
  activeDeadlineSeconds: 25200
  ttlSecondsAfterFinished: 21600
  template:
    metadata: { labels: { app: mlperf-ds-mn-server, role: worker, benchmark: deepseek-r1, run: ${RUN} } }
    spec:
      restartPolicy: Never
      hostNetwork: true
      hostIPC: true
      imagePullSecrets: [{ name: regcred }]
      containers:
        - name: worker
          image: <your-registry>/<your-project>/deepseek_sglang_v0.5.15
          securityContext: { privileged: true }
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -x
              ulimit -Sn 524288 2>/dev/null || true
              HEAD_IP=${HEAD_IP}; OUT=${OUT}
              mkdir -p /model "$OUT"
              ln -sfn /shared/models/deepseek-r1/S3_sq_a05_v2 /model/S3_sq_a05_v2
              mkdir -p /shared/ds-cache/hf; ln -sfn /shared/ds-cache /root/.cache 2>/dev/null || true
              if [ -f /shared/patches-ds/harden-worker-register.py ]; then python3 /shared/patches-ds/harden-worker-register.py; else echo "NOTE: ds server worker patch not staged"; fi
              cd /lab-mlperf-inference/code
              # --- WARMUP enablement (must match the head) ---
              [ -f /shared/patches-ds/enable-deepseek-warmup.py ] && python3 /shared/patches-ds/enable-deepseek-warmup.py || echo "WARN: warmup patch missing"
              [ -f /shared/patches-ds/server_mn_warmup.yaml ] && cp /shared/patches-ds/server_mn_warmup.yaml deepseek-r1/server_mi355x_mn.yaml || true
              sed -i 's|model_path: /model/S3_sq_a05_v2/|model_path: /model/S3_sq_a05_v2|' deepseek-r1/server_mi355x_mn.yaml 2>/dev/null || true
              sleep $(( ${JOB_COMPLETION_INDEX:-0} * 3 ))
              echo "DS SERVER-WARMUP WORKER $(hostname) [idx=${JOB_COMPLETION_INDEX:-?}] -> head ${HEAD_IP}:12345 | warmup=$(grep -m1 enable_warmup deepseek-r1/server_mi355x_mn.yaml) constants=$(grep -c "'deepseek-r1'" harness_llm/backends/common/constants.py)"
              python3 harness_llm/backends/vllm/zmq/distributed_async_server.py \
                --config-path deepseek-r1/ --config-name server_mi355x_mn --backend zmq \
                node_id=$(hostname) headnode_address=${HEAD_IP}:12345 \
                2>&1 | tee "$OUT/worker-$(hostname).log" | tail -20
          resources: { requests: { amd.com/gpu: 8, cpu: "180", memory: 1800Gi }, limits: { amd.com/gpu: 8 } }
          volumeMounts: [{ name: shared, mountPath: /shared }, { name: dshm, mountPath: /dev/shm }]
      volumes:
        - { name: shared, persistentVolumeClaim: { claimName: mlperf-shared } }
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 512Gi } }
