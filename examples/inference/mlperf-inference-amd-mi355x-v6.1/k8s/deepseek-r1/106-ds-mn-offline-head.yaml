# DeepSeek-R1 v6.1 multi-node ZMQ distributed SUT - OFFLINE HEAD (template).
# Rendered by launch-mn-deepseek.sh. DeepSeek MN uses the SAME ZMQ head/worker mechanism as
# gpt-oss (adapted from k8s/106): head binds :12345 (dispatch) / :12346 (results) + a local
# worker; N-1 worker pods connect back. Each node = one 8-GPU SGLang replica (TP8/EP8/DP-attn8);
# device_count = 8*N. No cross-node RCCL - only TCP token streams.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${RUN}-head
  namespace: mlperf
  labels: { app: mlperf-ds-mn-offline, role: head, benchmark: deepseek-r1, run: ${RUN} }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 25200      # 7h - so a head can't zombie forever if its workers die (it hung 5.5h once)
  ttlSecondsAfterFinished: 10800
  template:
    metadata: { labels: { app: mlperf-ds-mn-offline, role: head, benchmark: deepseek-r1, run: ${RUN} } }
    spec:
      restartPolicy: Never
      hostNetwork: true
      hostIPC: true
      imagePullSecrets: [{ name: regcred }]
      nodeName: ${HEAD_NODE}
      containers:
        - name: head
          image: <your-registry>/<your-project>/deepseek_sglang_v0.5.15
          securityContext: { privileged: true }
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -x
              ulimit -Sn 524288 2>/dev/null || ulimit -Sn 262144 2>/dev/null || true
              echo "fd limit now: $(ulimit -Sn)"
              # tail-only lost-None safety net: if <=TAIL exit-sentinels remain and the results
              # socket is idle this long, finalize instead of hanging forever (see patches/
              # harden-offline-sut.py). Harmless <=32 nodes (only fires on a genuine lost sentinel).
              export HARNESS_RECV_IDLE_TIMEOUT_S=${HARNESS_RECV_IDLE_TIMEOUT_S:-900} HARNESS_RECV_TAIL=${HARNESS_RECV_TAIL:-3}
              HEAD_IP=${HEAD_IP}; OUT=${OUT}
              mkdir -p /model /data/deepseek-r1 "$OUT/head"
              rm -f "$OUT/head"/mlperf_log_*.txt "$OUT/head"/mlperf_log_*.json "$OUT/head-sut.log" "$OUT"/worker-*.log 2>/dev/null || true
              ln -sfn /shared/models/deepseek-r1/S3_sq_a05_v2 /model/S3_sq_a05_v2
              ln -sfn /shared/datasets/deepseek-r1/mlperf_deepseek_r1_dataset_4388_fp8_eval.pkl \
                      /data/deepseek-r1/mlperf_deepseek_r1_dataset_4388_fp8_eval.pkl
              mkdir -p /shared/ds-cache/hf; rm -rf /root/.cache && ln -sfn /shared/ds-cache /root/.cache
              # large-fleet ZMQ registration hardening (verify anchors vs this image's harness first!)
              if [ -f /shared/patches-ds/harden-offline-sut.py ]; then python3 /shared/patches-ds/harden-offline-sut.py; else echo "NOTE: ds offline head patch not staged (ok for <=32 nodes)"; fi
              cd /lab-mlperf-inference/code
              # (1) local worker for this node's 8 GPUs (one SGLang replica), connects to self.
              # Skipped for a DEDICATED head (__LOCAL_WORKER__=0, launcher DEDICATED_HEAD=1): at >=64
              # nodes the head's heavy result post-proc starves this co-located worker's SGLang
              # scheduler -> its watchdog aborts -> lost range result -> head hangs 63/64.
              if [ "__LOCAL_WORKER__" = "1" ]; then
                python3 harness_llm/backends/vllm/zmq/distributed_sync_offline.py \
                  --config-path deepseek-r1/ --config-name offline_mi355x_mn --backend zmq \
                  node_id=$(hostname) headnode_address=${HEAD_IP}:12345 > "$OUT/worker-head.log" 2>&1 &
                sleep 5
              else echo "DEDICATED head: no co-located worker (all ${DEVICE_COUNT} GPUs are remote workers)"; fi
              # (2) SUT client - binds :12345/:12346, waits for ${DEVICE_COUNT} GPUs of workers, runs LoadGen Offline
              bash run_harness.sh --config-path deepseek-r1/ --config-name offline_mi355x_mn --backend zmq \
                test_mode=${TEST_MODE} port=12345 harness_config.device_count=${DEVICE_COUNT} \
                harness_config.target_qps=${TARGET_QPS} \
                harness_config.user_conf_path=/lab-mlperf-inference/code/deepseek-r1/user_mi355x_mn.conf \
                harness_config.output_log_dir="$OUT/head" 2>&1 | tee "$OUT/head-sut.log" | tail -50
              echo "===== ${RUN} OFFLINE RESULT (device_count=${DEVICE_COUNT}, test_mode=${TEST_MODE}) ====="
              grep -iE 'Result is|Tokens per second|Samples per second|tokens_per_sample' "$OUT/head/mlperf_log_summary.txt" 2>/dev/null
              if [ "${TEST_MODE}" = accuracy ]; then ls -la "$OUT/head/mlperf_log_accuracy.json" 2>/dev/null && echo "accuracy log ready - score with check_deepseek_accuracy_scores.sh"; fi
              true   # ensure the container exits 0 on a VALID perf run (the [ ]&&... idiom above returns 1 in perf mode)
          resources: { requests: { amd.com/gpu: 8, cpu: "180", memory: 1800Gi }, limits: { amd.com/gpu: 8 } }
          volumeMounts: [{ name: shared, mountPath: /shared }, { name: dshm, mountPath: /dev/shm }]
      volumes:
        - { name: shared, persistentVolumeClaim: { claimName: mlperf-shared } }
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 512Gi } }
