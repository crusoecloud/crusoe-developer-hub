<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="t d">
  <title id="t">Crusoe Managed MLflow reference architecture</title>
  <desc id="d">Your ML code, using the MLflow SDK and an OpenAI-compatible SDK, sends params and metrics, traces, and scores and prompts to Crusoe Managed MLflow, which holds experiment tracking, tracing, evaluation results and a prompt registry. Your ML code also makes chat completion and LLM-judge calls to Managed Inference. Serverless Fine-Tuning sends training metrics to MLflow and checkpoints to Managed Inference, closing the loop inside Crusoe.</desc>
  <defs>
    <style>
      text { font-family: "ABC Diatype Mono", "Roboto Mono", Menlo, Consolas, monospace; }
      .h  { font-size: 20px; font-weight: 700; }
      .s  { font-size: 15px; }
      .xs { font-size: 13px; }
      .lbl { font-size: 12px; fill: #C3D6E7; }
      .mute { fill: #A3A3A3; }
      .line { stroke: #C3D6E7; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C3D6E7"/>
    </marker>
  </defs>

  <rect width="1200" height="530" fill="#000000"/>

  <!-- Column 1: your ML code -->
  <rect x="40" y="60" width="290" height="70" fill="#7799B6"/>
  <rect x="40" y="60" width="290" height="6" fill="#CEEB13"/>
  <text x="185" y="103" text-anchor="middle" class="h" fill="#000">Your ML Code</text>
  <text x="60" y="155" class="lbl">MLflow SDK  +  OpenAI-compatible SDK</text>

  <rect x="60" y="170" width="250" height="52" fill="#1C2A36" stroke="#7799B6" stroke-width="2"/>
  <text x="185" y="202" text-anchor="middle" class="s" fill="#FFF">Fine-tuning loop</text>

  <rect x="60" y="238" width="250" height="52" fill="#1C2A36" stroke="#7799B6" stroke-width="2"/>
  <text x="185" y="270" text-anchor="middle" class="s" fill="#FFF">LLM app or agent</text>

  <rect x="60" y="306" width="250" height="52" fill="#1C2A36" stroke="#7799B6" stroke-width="2"/>
  <text x="185" y="338" text-anchor="middle" class="s" fill="#FFF">Evaluation script</text>

  <!-- Column 2: Managed MLflow -->
  <rect x="440" y="60" width="320" height="70" fill="#395761"/>
  <rect x="440" y="60" width="320" height="6" fill="#CEEB13"/>
  <text x="600" y="94" text-anchor="middle" class="h" fill="#FFF">Crusoe Managed MLflow</text>
  <text x="600" y="118" text-anchor="middle" class="xs" fill="#C3D6E7">hosted tracking server + UI</text>

  <rect x="460" y="170" width="280" height="44" fill="#C3D6E7"/>
  <text x="600" y="198" text-anchor="middle" class="s" fill="#000">Experiment tracking</text>
  <rect x="460" y="226" width="280" height="44" fill="#C3D6E7"/>
  <text x="600" y="254" text-anchor="middle" class="s" fill="#000">Tracing</text>
  <rect x="460" y="282" width="280" height="44" fill="#C3D6E7"/>
  <text x="600" y="310" text-anchor="middle" class="s" fill="#000">Evaluation results</text>
  <rect x="460" y="338" width="280" height="44" fill="#C3D6E7"/>
  <text x="600" y="366" text-anchor="middle" class="s" fill="#000">Prompt registry</text>

  <text x="600" y="415" text-anchor="middle" class="xs mute">stores runs, traces, scores and prompts</text>
  <text x="600" y="435" text-anchor="middle" class="xs mute">metadata only, no artifact bytes</text>

  <!-- Column 3: Intelligence Foundry -->
  <rect x="870" y="60" width="290" height="70" fill="#ECAC45"/>
  <rect x="870" y="60" width="290" height="6" fill="#CEEB13"/>
  <text x="1015" y="94" text-anchor="middle" class="h" fill="#000">Intelligence Foundry</text>
  <text x="1015" y="118" text-anchor="middle" class="xs" fill="#000">Crusoe managed AI services</text>

  <rect x="890" y="170" width="250" height="90" fill="#FFE0AE" stroke="#CD881A" stroke-width="2"/>
  <text x="1015" y="202" text-anchor="middle" class="s" fill="#000">Managed Inference</text>
  <text x="1015" y="226" text-anchor="middle" class="xs" fill="#000">open-weight models</text>
  <text x="1015" y="246" text-anchor="middle" class="xs" fill="#000">OpenAI-compatible API</text>

  <rect x="890" y="300" width="250" height="58" fill="#FFE0AE" stroke="#CD881A" stroke-width="2"/>
  <text x="1015" y="335" text-anchor="middle" class="s" fill="#000">Serverless Fine-Tuning</text>

  <!-- Arrows: your ML code -> MLflow -->
  <path d="M310 196 H440" class="line" marker-end="url(#arrow)"/>
  <text x="375" y="188" text-anchor="middle" class="lbl">params, metrics</text>

  <path d="M310 264 H440" class="line" marker-end="url(#arrow)"/>
  <text x="375" y="256" text-anchor="middle" class="lbl">traces</text>

  <path d="M310 332 H440" class="line" marker-end="url(#arrow)"/>
  <text x="375" y="324" text-anchor="middle" class="lbl">scores, prompts</text>

  <!-- Arrow: your ML code -> Managed Inference, routed below and around -->
  <path d="M185 358 V480 H1170 V215 H1140" class="line" marker-end="url(#arrow)"/>
  <text x="600" y="472" text-anchor="middle" class="lbl">chat completions and LLM-judge calls, made from your process</text>

  <!-- Fine-tuning loop -->
  <path d="M890 329 H760" class="line" marker-end="url(#arrow)"/>
  <text x="825" y="321" text-anchor="middle" class="lbl">metrics</text>
  <path d="M1015 300 V260" class="line" marker-end="url(#arrow)"/>
  <text x="1005" y="285" text-anchor="end" class="lbl">checkpoint</text>
</svg>
