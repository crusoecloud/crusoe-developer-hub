[project]
name = "post-training-rl-model"
version = "0.1.0"
description = "Reasoning models from scratch: generation, evaluation, inference-time scaling, GRPO, and distillation on a small open model."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Crusoe AI", email = "devcommunity@crusoe.ai" },
]
dependencies = [
    "torch>=2.10,<3",
    "tokenizers>=0.22",
    "huggingface-hub>=1.0",
    "safetensors>=0.5",
    "sympy>=1.14",
    "matplotlib>=3.10",
    "jupyterlab>=4.4",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbconvert>=7.16",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.uv]
# A lesson track, not a library: uv builds the environment but installs nothing
# from this directory itself. The notebooks import `reasoning_utils` from the
# working directory.
package = false

[tool.ruff]
line-length = 110
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
