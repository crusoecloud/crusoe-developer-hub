<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" font-family="'Roboto Mono','Menlo','Courier New',monospace" font-size="14">
  <style>
    .box { stroke: #000; stroke-width: 2; }
    .t { fill: #000; }
    .tw { fill: #fff; }
    .small { font-size: 12px; }
    .label { font-size: 12px; fill: #395761; }
    .arrow { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#head); }
    .dashed { stroke: #395761; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#headteal); }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="headteal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#395761"/>
    </marker>
  </defs>

  <!-- row 1: RLHF -->
  <text x="30" y="40" class="label">RL from human feedback: the reward is learned from people</text>

  <rect x="30" y="60" width="150" height="70" class="box" fill="#C3D6E7"/>
  <text x="105" y="90" text-anchor="middle" class="t">prompt</text>
  <text x="105" y="112" text-anchor="middle" class="t small">"write a poem"</text>

  <path d="M180,95 L218,95" class="arrow"/>

  <rect x="220" y="60" width="150" height="70" class="box" fill="#395761"/>
  <text x="295" y="90" text-anchor="middle" class="tw">LLM</text>
  <text x="295" y="112" text-anchor="middle" class="tw small">the policy</text>

  <path d="M370,95 L408,95" class="arrow"/>

  <rect x="410" y="60" width="170" height="70" class="box" fill="#E4E2E0"/>
  <text x="495" y="90" text-anchor="middle" class="t">responses</text>
  <text x="495" y="112" text-anchor="middle" class="t small">several per prompt</text>

  <path d="M580,95 L618,95" class="arrow"/>

  <rect x="620" y="60" width="180" height="70" class="box" fill="#ECAC45"/>
  <text x="710" y="90" text-anchor="middle" class="t">people rank them</text>
  <text x="710" y="112" text-anchor="middle" class="t small">slow and expensive</text>

  <path d="M800,95 L838,95" class="arrow"/>

  <rect x="840" y="60" width="180" height="70" class="box" fill="#ECAC45"/>
  <text x="930" y="90" text-anchor="middle" class="t">reward model</text>
  <text x="930" y="112" text-anchor="middle" class="t small">a second LLM, trained</text>

  <path d="M1020,95 L1058,95" class="arrow"/>

  <rect x="1060" y="60" width="190" height="70" class="box" fill="#CEEB13"/>
  <text x="1155" y="90" text-anchor="middle" class="t">reward</text>
  <text x="1155" y="112" text-anchor="middle" class="t small">a learned guess</text>

  <!-- feedback arrow back to the policy -->
  <path d="M1155,130 L1155,160 L295,160 L295,132" class="dashed"/>
  <text x="725" y="180" text-anchor="middle" class="label">update the weights toward higher reward</text>

  <!-- divider -->
  <path d="M30,210 L1250,210" stroke="#E4E2E0" stroke-width="2"/>

  <!-- row 2: RLVR -->
  <text x="30" y="246" class="label">RL with verifiable rewards: the reward is checked by a program</text>

  <rect x="30" y="266" width="150" height="70" class="box" fill="#C3D6E7"/>
  <text x="105" y="296" text-anchor="middle" class="t">prompt</text>
  <text x="105" y="318" text-anchor="middle" class="t small">a math problem</text>

  <path d="M180,301 L218,301" class="arrow"/>

  <rect x="220" y="266" width="150" height="70" class="box" fill="#395761"/>
  <text x="295" y="296" text-anchor="middle" class="tw">LLM</text>
  <text x="295" y="318" text-anchor="middle" class="tw small">the policy</text>

  <path d="M370,301 L408,301" class="arrow"/>

  <rect x="410" y="266" width="170" height="70" class="box" fill="#E4E2E0"/>
  <text x="495" y="296" text-anchor="middle" class="t">responses</text>
  <text x="495" y="318" text-anchor="middle" class="t small">several per prompt</text>

  <path d="M580,301 L618,301" class="arrow"/>

  <rect x="620" y="266" width="400" height="70" class="box" fill="#99AE88"/>
  <text x="820" y="296" text-anchor="middle" class="t">the math verifier from the evaluation stage</text>
  <text x="820" y="318" text-anchor="middle" class="t small">extract, normalize, compare: instant and free</text>

  <path d="M1020,301 L1058,301" class="arrow"/>

  <rect x="1060" y="266" width="190" height="70" class="box" fill="#CEEB13"/>
  <text x="1155" y="296" text-anchor="middle" class="t">reward</text>
  <text x="1155" y="318" text-anchor="middle" class="t small">1 if correct, else 0</text>

  <path d="M1155,336 L1155,366 L295,366 L295,338" class="dashed"/>
  <text x="725" y="386" text-anchor="middle" class="label">update the weights toward higher reward: the same loop, a cheaper judge</text>

  <text x="640" y="440" text-anchor="middle" class="t small">both are reinforcement learning: try, get a reward, change the weights. Only the source of the reward differs.</text>
</svg>
