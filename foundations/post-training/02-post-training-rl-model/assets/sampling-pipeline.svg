<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" font-family="'Roboto Mono','Menlo','Courier New',monospace" font-size="14">
  <style>
    .box { stroke: #000; stroke-width: 2; }
    .t { fill: #000; }
    .tw { fill: #fff; }
    .small { font-size: 12px; }
    .label { font-size: 12px; fill: #395761; }
    .arrow { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#head); }
    .dash { stroke: #395761; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#headteal); }
    .code { font-size: 12px; fill: #000; }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="headteal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#395761"/>
    </marker>
  </defs>

  <text x="640" y="34" text-anchor="middle" class="label">one decoding step: what happens to the row of logits before the next token is chosen</text>

  <!-- logits -->
  <rect x="30" y="150" width="170" height="80" class="box" fill="#395761"/>
  <text x="115" y="185" text-anchor="middle" class="tw">logits</text>
  <text x="115" y="207" text-anchor="middle" class="tw small">(batch, 151936)</text>

  <!-- sampling path, bottom row -->
  <path d="M200,190 L258,190" class="arrow"/>
  <rect x="260" y="150" width="190" height="80" class="box" fill="#C3D6E7"/>
  <text x="355" y="180" text-anchor="middle" class="t">/ temperature</text>
  <text x="355" y="204" text-anchor="middle" class="code">scale_by_temperature</text>

  <path d="M450,190 L508,190" class="arrow"/>
  <rect x="510" y="150" width="160" height="80" class="box" fill="#C3D6E7"/>
  <text x="590" y="180" text-anchor="middle" class="t">softmax</text>
  <text x="590" y="204" text-anchor="middle" class="code">probabilities</text>

  <path d="M670,190 L728,190" class="arrow"/>
  <rect x="730" y="150" width="170" height="80" class="box" fill="#CEEB13"/>
  <text x="815" y="180" text-anchor="middle" class="t">top-p filter</text>
  <text x="815" y="204" text-anchor="middle" class="code">top_p_filter</text>

  <path d="M900,190 L958,190" class="arrow"/>
  <rect x="960" y="150" width="150" height="80" class="box" fill="#ECAC45"/>
  <text x="1035" y="180" text-anchor="middle" class="t">draw one</text>
  <text x="1035" y="204" text-anchor="middle" class="code">multinomial</text>

  <path d="M1110,190 L1168,190" class="arrow"/>
  <rect x="1170" y="160" width="90" height="60" class="box" fill="#fff"/>
  <text x="1215" y="185" text-anchor="middle" class="t small">next</text>
  <text x="1215" y="203" text-anchor="middle" class="t small">token</text>

  <!-- greedy bypass, top -->
  <path d="M115,150 L115,90 L598,90" class="dash"/>
  <rect x="600" y="60" width="160" height="60" class="box" fill="#E4E2E0"/>
  <text x="680" y="85" text-anchor="middle" class="t">argmax</text>
  <text x="680" y="105" text-anchor="middle" class="code">temperature = 0</text>
  <path d="M760,90 L1215,90 L1215,158" class="dash"/>
  <text x="360" y="78" text-anchor="middle" class="label">greedy decoding: the loop as it was</text>

  <!-- notes under the sampling path -->
  <text x="355" y="262" text-anchor="middle" class="label">below 1 sharpens,</text>
  <text x="355" y="280" text-anchor="middle" class="label">above 1 flattens</text>
  <text x="590" y="262" text-anchor="middle" class="label">sums to 1</text>
  <text x="815" y="262" text-anchor="middle" class="label">keep the head, drop</text>
  <text x="815" y="280" text-anchor="middle" class="label">the tail, renormalize</text>
  <text x="1035" y="262" text-anchor="middle" class="label">a random draw,</text>
  <text x="1035" y="280" text-anchor="middle" class="label">different every run</text>

  <text x="640" y="330" text-anchor="middle" class="label">the loop around it is unchanged: feed the token back, repeat until end-of-sequence or the budget</text>
</svg>
