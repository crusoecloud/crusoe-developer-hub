<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 520" width="1340" height="520" font-family="'Roboto Mono','Menlo','Courier New',monospace" font-size="14">
  <style>
    .box { stroke: #000; stroke-width: 2; }
    .t { fill: #000; }
    .small { font-size: 12px; }
    .tiny { font-size: 10.5px; }
    .label { font-size: 12px; fill: #395761; }
    .arrow { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#head); }
    .dashed { stroke: #395761; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#headteal); }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="headteal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#395761"/>
    </marker>
  </defs>
  <text x="30" y="40" text-anchor="start" class="label">one GRPO step: one problem, a group of rollouts, one weight update</text>
  <rect x="30" y="200" width="150" height="80" class="box" fill="#C3D6E7"/>
  <text x="105" y="232" text-anchor="middle" class="t">one problem</text>
  <text x="105" y="254" text-anchor="middle" class="t small">+ reference</text>
  <text x="105" y="270" text-anchor="middle" class="t small">answer 126</text>
  <path d="M180,240 L218,240" class="arrow"/>
  <rect x="220" y="80" width="190" height="320" class="box" fill="#FFFFFF"/>
  <rect x="222" y="82" width="186" height="58" fill="#99AE88" stroke="none"/>
  <circle cx="244" cy="104" r="12" fill="#000"/>
  <text x="244" y="109" text-anchor="middle" class="small" fill="#fff">1</text>
  <text x="321.0" y="109" text-anchor="middle" class="t">sample</text>
  <path d="M380,103 l6,6 l12,-14" stroke="#000" stroke-width="3" fill="none"/>
  <text x="315.0" y="130" text-anchor="middle" class="label">n responses, the group</text>
  <rect x="240" y="150" width="150" height="44" class="box" fill="#E4E2E0"/>
  <text x="315.0" y="177" text-anchor="middle" class="t tiny">\boxed{126}</text>
  <rect x="240" y="206" width="150" height="44" class="box" fill="#E4E2E0"/>
  <text x="315.0" y="225" text-anchor="middle" class="t tiny">The area is</text>
  <text x="315.0" y="240" text-anchor="middle" class="t tiny">\boxed{126}</text>
  <rect x="240" y="262" width="150" height="44" class="box" fill="#E4E2E0"/>
  <text x="315.0" y="289" text-anchor="middle" class="t tiny">The area is 126</text>
  <rect x="240" y="318" width="150" height="44" class="box" fill="#E4E2E0"/>
  <text x="315.0" y="337" text-anchor="middle" class="t tiny">So the area is</text>
  <text x="315.0" y="352" text-anchor="middle" class="t tiny">\boxed{240}</text>
  <text x="315.0" y="386" text-anchor="middle" class="label">T 0.8, top-p 0.9</text>
  <path d="M390,240 L428,240" class="arrow"/>
  <rect x="430" y="80" width="150" height="320" class="box" fill="#FFFFFF"/>
  <rect x="432" y="82" width="146" height="58" fill="#CEEB13" stroke="none"/>
  <circle cx="454" cy="104" r="12" fill="#000"/>
  <text x="454" y="109" text-anchor="middle" class="small" fill="#fff">2</text>
  <text x="511.0" y="109" text-anchor="middle" class="t">reward</text>
  <text x="505.0" y="130" text-anchor="middle" class="label">the verifier judges</text>
  <rect x="450" y="150" width="110" height="44" class="box" fill="#ECAC45"/>
  <text x="505.0" y="177" text-anchor="middle" class="t small">1.0</text>
  <rect x="450" y="206" width="110" height="44" class="box" fill="#ECAC45"/>
  <text x="505.0" y="233" text-anchor="middle" class="t small">1.0</text>
  <rect x="450" y="262" width="110" height="44" class="box" fill="#E4E2E0"/>
  <text x="505.0" y="289" text-anchor="middle" class="t small">0.0</text>
  <rect x="450" y="318" width="110" height="44" class="box" fill="#E4E2E0"/>
  <text x="505.0" y="345" text-anchor="middle" class="t small">0.0</text>
  <text x="505.0" y="386" text-anchor="middle" class="label">boxed and correct?</text>
  <path d="M560,240 L598,240" class="arrow"/>
  <rect x="600" y="80" width="150" height="320" class="box" fill="#FFFFFF"/>
  <rect x="602" y="82" width="146" height="58" fill="#FFFFFF" stroke="none"/>
  <circle cx="624" cy="104" r="12" fill="#000"/>
  <text x="624" y="109" text-anchor="middle" class="small" fill="#fff">3</text>
  <text x="681.0" y="109" text-anchor="middle" class="t">compare</text>
  <text x="675.0" y="130" text-anchor="middle" class="label">within the group</text>
  <rect x="620" y="150" width="110" height="44" class="box" fill="#CEEB13"/>
  <text x="675.0" y="177" text-anchor="middle" class="t small">+0.87</text>
  <rect x="620" y="206" width="110" height="44" class="box" fill="#CEEB13"/>
  <text x="675.0" y="233" text-anchor="middle" class="t small">+0.87</text>
  <rect x="620" y="262" width="110" height="44" class="box" fill="#E4E2E0"/>
  <text x="675.0" y="289" text-anchor="middle" class="t small">-0.87</text>
  <rect x="620" y="318" width="110" height="44" class="box" fill="#E4E2E0"/>
  <text x="675.0" y="345" text-anchor="middle" class="t small">-0.87</text>
  <text x="675.0" y="386" text-anchor="middle" class="label">vs the group mean</text>
  <path d="M730,240 L768,240" class="arrow"/>
  <rect x="770" y="80" width="170" height="320" class="box" fill="#FFFFFF"/>
  <rect x="772" y="82" width="166" height="58" fill="#FFFFFF" stroke="none"/>
  <circle cx="794" cy="104" r="12" fill="#000"/>
  <text x="794" y="109" text-anchor="middle" class="small" fill="#fff">4</text>
  <text x="861.0" y="109" text-anchor="middle" class="t">score</text>
  <text x="855.0" y="130" text-anchor="middle" class="label">log-prob of each</text>
  <rect x="790" y="150" width="130" height="44" class="box" fill="#7799B6"/>
  <text x="855.0" y="177" text-anchor="middle" class="t small">-8.46</text>
  <rect x="790" y="206" width="130" height="44" class="box" fill="#7799B6"/>
  <text x="855.0" y="233" text-anchor="middle" class="t small">-19.25</text>
  <rect x="790" y="262" width="130" height="44" class="box" fill="#7799B6"/>
  <text x="855.0" y="289" text-anchor="middle" class="t small">-17.44</text>
  <rect x="790" y="318" width="130" height="44" class="box" fill="#7799B6"/>
  <text x="855.0" y="345" text-anchor="middle" class="t small">-27.32</text>
  <text x="855.0" y="386" text-anchor="middle" class="label">sum, with gradients</text>
  <path d="M920,240 L958,240" class="arrow"/>
  <rect x="960" y="80" width="350" height="320" class="box" fill="#FFFFFF"/>
  <rect x="962" y="82" width="346" height="58" fill="#FFFFFF" stroke="none"/>
  <circle cx="984" cy="104" r="12" fill="#000"/>
  <text x="984" y="109" text-anchor="middle" class="small" fill="#fff">5</text>
  <text x="1141.0" y="109" text-anchor="middle" class="t">loss</text>
  <text x="1135.0" y="130" text-anchor="middle" class="label">advantage x log-prob, per rollout</text>
  <rect x="980" y="150" width="310" height="44" class="box" fill="#CEEB13"/>
  <text x="1135.0" y="177" text-anchor="middle" class="t small">+0.87 x -8.46 = -7.33</text>
  <rect x="980" y="206" width="310" height="44" class="box" fill="#CEEB13"/>
  <text x="1135.0" y="233" text-anchor="middle" class="t small">+0.87 x -19.25 = -16.67</text>
  <rect x="980" y="262" width="310" height="44" class="box" fill="#E4E2E0"/>
  <text x="1135.0" y="289" text-anchor="middle" class="t small">-0.87 x -17.44 = +15.10</text>
  <rect x="980" y="318" width="310" height="44" class="box" fill="#E4E2E0"/>
  <text x="1135.0" y="345" text-anchor="middle" class="t small">-0.87 x -27.32 = +23.66</text>
  <text x="1135.0" y="386" text-anchor="middle" class="label">loss = -mean = -3.69</text>
  <path d="M1135,400 L1135,440 L105,440 L105,282" class="dashed"/>
  <text x="680" y="462" text-anchor="middle" class="label">backward on the loss raises the log-prob of the two rollouts with a positive advantage and lowers the other two;</text>
  <text x="680" y="480" text-anchor="middle" class="label">one optimizer step, then the next problem</text>
  <text x="680" y="508" text-anchor="middle" class="t small">the numbers are the four example rollouts from the notebook: two correct, one unboxed, one wrong</text>
</svg>
