<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" font-family="'Roboto Mono','Menlo','Courier New',monospace" font-size="13">
  <style>
    .box { stroke: #000; stroke-width: 2; }
    .t { fill: #000; }
    .tw { fill: #fff; }
    .small { font-size: 12px; }
    .label { font-size: 12px; fill: #395761; }
    .arrow { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- dataset record -->
  <rect x="30" y="40" width="260" height="130" class="box" fill="#C3D6E7"/>
  <text x="46" y="62" class="label">one benchmark record</text>
  <text x="46" y="88" class="t small">problem: What is the sum of</text>
  <text x="46" y="106" class="t small">  the roots of 2x^2 - 7x + 3 = 0?</text>
  <rect x="40" y="122" width="240" height="24" class="box" fill="#ECAC45"/>
  <text x="46" y="139" class="t small">answer: \frac{7}{2}</text>
  <text x="160" y="164" text-anchor="middle" class="label">reference answer</text>

  <!-- model -->
  <path d="M290,80 L348,80" class="arrow"/>
  <rect x="350" y="52" width="120" height="56" class="box" fill="#395761"/>
  <text x="410" y="76" text-anchor="middle" class="tw small">LLM</text>
  <text x="410" y="94" text-anchor="middle" class="tw small">generate</text>

  <!-- response -->
  <path d="M470,80 L528,80" class="arrow"/>
  <rect x="530" y="40" width="420" height="90" class="box" fill="#fff"/>
  <text x="546" y="62" class="label">free-form response</text>
  <text x="546" y="84" class="t small">By Vieta's formulas the roots sum to -b/a = 7/2.</text>
  <text x="546" y="112" class="t small">**Final Answer:**</text>
  <rect x="690" y="96" width="170" height="24" class="box" fill="#CEEB13"/>
  <text x="775" y="112" text-anchor="middle" class="t small">\boxed{\dfrac{7}{2}}</text>

  <!-- pipeline column: each stage box (530..660) and value box (680..860), centered rows at y = 192, 262, 332 -->
  <path d="M740,130 L740,168" class="arrow"/>

  <rect x="530" y="170" width="130" height="44" class="box" fill="#99AE88"/>
  <text x="595" y="197" text-anchor="middle" class="t small">extract</text>
  <path d="M660,192 L678,192" class="arrow"/>
  <rect x="680" y="170" width="180" height="44" class="box" fill="#fff"/>
  <text x="770" y="197" text-anchor="middle" class="t small">\dfrac{7}{2}</text>

  <path d="M770,214 L770,238" class="arrow"/>
  <rect x="530" y="240" width="130" height="44" class="box" fill="#99AE88"/>
  <text x="595" y="267" text-anchor="middle" class="t small">normalize</text>
  <path d="M660,262 L678,262" class="arrow"/>
  <rect x="680" y="240" width="180" height="44" class="box" fill="#fff"/>
  <text x="770" y="267" text-anchor="middle" class="t small">(7)/(2)</text>

  <path d="M770,284 L770,308" class="arrow"/>
  <rect x="530" y="310" width="130" height="44" class="box" fill="#99AE88"/>
  <text x="595" y="337" text-anchor="middle" class="t small">parse (SymPy)</text>
  <path d="M660,332 L678,332" class="arrow"/>
  <rect x="680" y="310" width="180" height="44" class="box" fill="#fff"/>
  <text x="770" y="337" text-anchor="middle" class="t small">7/2</text>

  <!-- reference path joins the compare step -->
  <path d="M160,170 L160,332 L528,332" class="arrow"/>
  <text x="340" y="322" text-anchor="middle" class="label">the reference goes through normalize and parse too</text>

  <!-- compare -->
  <path d="M860,332 L878,332" class="arrow"/>
  <rect x="880" y="300" width="80" height="64" class="box" fill="#CEEB13"/>
  <text x="920" y="326" text-anchor="middle" class="t small">equal?</text>
  <text x="920" y="348" text-anchor="middle" class="t">True</text>

  <text x="340" y="232" text-anchor="middle" class="label">generate once, then grade with code,</text>
  <text x="340" y="252" text-anchor="middle" class="label">not with another model</text>
</svg>
